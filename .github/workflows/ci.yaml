name: CI
# Controls when the action will run.
on:
  # Triggers the workflow on push or pull request events but only for the main branch
  push:
    branches: [main]
  pull_request:
    branches: [main]
  # Allows you to run this workflow manually from the Actions tab
  workflow_dispatch:
  workflow_call:
concurrency:
  # Cancel previous actions from the same PR or branch except 'main' branch.
  # See https://docs.github.com/en/actions/using-jobs/using-concurrency and https://docs.github.com/en/actions/learn-github-actions/contexts for more info.
  group: concurrency-group::${{ github.workflow }}::${{ github.event.pull_request.number > 0 && format('pr-{0}', github.event.pull_request.number) || github.ref_name }}${{ github.ref_name == 'main' && format('::{0}', github.run_id) || ''}}
  cancel-in-progress: ${{ github.ref_name != 'main' }}
env:
  # hermeticbuild/hermetic-llvm already publishes this BuildBuddy key, so fork
  # pull requests can use remote execution without repository secrets.
  BUILDBUDDY_API_KEY: 4jtaxdhxtyu4ylxdEwI7
jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        # only test on linux for now, macos is not ready.
        os: [ubuntu-latest, ubuntu-24.04-arm]
        bazel_version: [8.x, 9.x]
        folder:
          - "."
          - "test"
    runs-on: ${{ matrix.os }}

    # Configure a human readable name for each job
    name: Test ${{ matrix.folder }} with Bazel ${{ matrix.bazel_version }} on ${{ matrix.os }}

    steps:
      - uses: actions/checkout@v6

      # test/git_crates/Cargo.toml exercises SSH-form GitHub dependencies, but
      # fork pull requests cannot access SSH_PRIVATE_KEY for that public repo.
      - name: Fetch public GitHub SSH dependencies over HTTPS
        shell: bash
        run: |
          git config --global --add url."https://github.com/".insteadOf "ssh://git@github.com/"
          git config --global --add url."https://github.com/".insteadOf "git@github.com:"

      # Cache build and external artifacts so that the next ci build is incremental.
      # Because github action caches cannot be updated after a build, we need to
      # store the contents of each build in a unique cache key, then fall back to loading
      # it on the next ci run. We use hashFiles(...) in the key and restore-keys- with
      # the prefix to load the most recent cache for the branch on a cache miss. You
      # should customize the contents of hashFiles to capture any bazel input sources,
      # although this doesn't need to be perfect. If none of the input sources change
      # then a cache hit will load an existing cache and bazel won't have to do any work.
      # In the case of a cache miss, you want the fallback cache to contain most of the
      # previously built artifacts to minimize build time. The more precise you are with
      # hashFiles sources the less work bazel will have to do.
      - name: Mount bazel caches
        uses: actions/cache@v4
        with:
          path: |
            ~/.cache/bazel-repo
          key: bazel-cache-${{ matrix.os }}-${{ matrix.bazel_version }}-${{ matrix.folder }}-${{ hashFiles('**/BUILD.bazel', '**/*.bzl', 'MODULE.bazel') }}
          restore-keys: |
            bazel-cache-${{ matrix.os }}-${{ matrix.bazel_version }}-${{ matrix.folder }}

      - name: bazel test //...
        env:
          USE_BAZEL_VERSION: ${{ matrix.bazel_version }}
        working-directory: ${{ matrix.folder }}
        shell: bash
        run: |
          # test/nextest:env_test checks that env_inherit forwards a variable from the Bazel
          # client environment, which is only meaningful if one is actually set there.
          export RULES_RS_NEXTEST_E2E_INHERITED=from-outside
          bazel \
            --bazelrc=.bazelrc \
            test \
            --config=remote \
            --remote_header=x-buildbuddy-api-key=$BUILDBUDDY_API_KEY \
            //...

      # The only thing that catches the multi-object coverage collector regressing: nextest
      # runs one process per test, so coverage depends on merging per-process profraw files
      # across every test binary in a target.
      - name: bazel coverage //nextest/...
        if: matrix.folder == 'test'
        env:
          USE_BAZEL_VERSION: ${{ matrix.bazel_version }}
        working-directory: test
        shell: bash
        run: |
          bazel \
            --bazelrc=.bazelrc \
            coverage \
            --config=remote \
            --remote_header=x-buildbuddy-api-key=$BUILDBUDDY_API_KEY \
            --instrumentation_filter=//nextest[:/] \
            //nextest/...
          report="$(bazel info output_path)/_coverage/_coverage_report.dat"
          if ! grep -q '^SF:nextest/' "$report"; then
            echo "::error::no nextest coverage in $report" >&2
            exit 1
          fi

  test_windows:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, windows-11-arm]
        bazel_version: [9.x]
        folder:
          - "test"
    runs-on: ${{ matrix.os }}

    # Configure a human readable name for each job
    name: Test ${{ matrix.folder }} with Bazel ${{ matrix.bazel_version }} on ${{ matrix.os }}

    steps:
      - uses: actions/checkout@v6

      # test/git_crates/Cargo.toml exercises SSH-form GitHub dependencies, but
      # fork pull requests cannot access SSH_PRIVATE_KEY for that public repo.
      - name: Fetch public GitHub SSH dependencies over HTTPS
        shell: bash
        run: |
          git config --global --add url."https://github.com/".insteadOf "ssh://git@github.com/"
          git config --global --add url."https://github.com/".insteadOf "git@github.com:"

      - name: bazel test windows targets
        id: bazel_test
        env:
          USE_BAZEL_VERSION: ${{ matrix.bazel_version }}
        working-directory: ${{ matrix.folder }}
        shell: bash
        run: |
          git config --global core.longpaths true
          bazel \
            --output_user_root=C:/bzl \
            --bazelrc=.bazelrc \
            build \
            --config=remote \
            --disk_cache= \
            --repository_cache= \
            --repo_contents_cache= \
            --remote_header=x-buildbuddy-api-key=$BUILDBUDDY_API_KEY \
            --jobs=100 \
            //:all_builds_aarch64-pc-windows-gnullvm \
            //:all_builds_x86_64-pc-windows-gnullvm

  test_windows_nextest:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, windows-11-arm]
        bazel_version: [9.x]
    runs-on: ${{ matrix.os }}

    # The existing test_windows job only builds. This one runs the nextest tests, which is what
    # exercises the runfiles manifest parser, Windows path canonicalization, the TOML escaping
    # of Windows paths, and the aarch64-pc-windows-msvc cargo-nextest prebuilt.
    name: Test //nextest with Bazel ${{ matrix.bazel_version }} on ${{ matrix.os }}
    continue-on-error: true

    steps:
      - uses: actions/checkout@v6

      # Tests execute locally, since the remote executors are linux; the remote cache is still
      # used. Both runfiles modes are covered: whatever the platform default is, and the
      # manifest-only path the runner materializes into TEST_TMPDIR. The flags are passed here
      # rather than in a .bazelrc so no other target's runfiles behaviour changes.
      - name: bazel test //nextest/... (default runfiles)
        env:
          USE_BAZEL_VERSION: ${{ matrix.bazel_version }}
        working-directory: test
        shell: bash
        run: |
          git config --global core.longpaths true
          # //nextest:env_test checks that env_inherit forwards a client environment variable,
          # so it has to be exported rather than passed with --test_env, which would set it
          # directly and pass even if env_inherit were broken.
          export RULES_RS_NEXTEST_E2E_INHERITED=from-outside
          bazel \
            --output_user_root=C:/bzl \
            --bazelrc=.bazelrc \
            test \
            --remote_cache=grpcs://remote.buildbuddy.io \
            --remote_header=x-buildbuddy-api-key=$BUILDBUDDY_API_KEY \
            //nextest/...

      - name: bazel test //nextest/... (manifest-only runfiles)
        env:
          USE_BAZEL_VERSION: ${{ matrix.bazel_version }}
        working-directory: test
        shell: bash
        run: |
          export RULES_RS_NEXTEST_E2E_INHERITED=from-outside
          bazel \
            --output_user_root=C:/bzl \
            --bazelrc=.bazelrc \
            test \
            --noenable_runfiles \
            --remote_cache=grpcs://remote.buildbuddy.io \
            --remote_header=x-buildbuddy-api-key=$BUILDBUDDY_API_KEY \
            //nextest/...

  test_macos_nextest:
    strategy:
      fail-fast: false
      matrix:
        bazel_version: [9.x]
    runs-on: macos-latest

    # macOS is not part of the main matrix yet, so this is advisory. It exercises the universal
    # cargo-nextest binary and DYLD_FALLBACK_LIBRARY_PATH handling.
    name: Test //nextest with Bazel ${{ matrix.bazel_version }} on macos-latest
    continue-on-error: true

    steps:
      - uses: actions/checkout@v6

      - name: bazel test //nextest/...
        env:
          USE_BAZEL_VERSION: ${{ matrix.bazel_version }}
        working-directory: test
        shell: bash
        run: |
          export RULES_RS_NEXTEST_E2E_INHERITED=from-outside
          bazel \
            --bazelrc=.bazelrc \
            test \
            --remote_header=x-buildbuddy-api-key=$BUILDBUDDY_API_KEY \
            //nextest/...
